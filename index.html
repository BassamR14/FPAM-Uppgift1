<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="register-div">
        <h2>Register</h2>
        <label>
          Username:
          <input
            type="text"
            id="register-user"
            placeholder="Choose your username"
        /></label>
        <label>
          Password:
          <input
            type="password"
            id="register-password"
            placeholder="Choose your password"
            autocomplete="off"
        /></label>

        <button id="register-btn">Register</button>
      </div>

      <div class="vl"></div>

      <div class="signIn-div">
        <h2>Sign in</h2>
        <label>
          Username:
          <input type="text" id="signIn-user" placeholder="Enter your username"
        /></label>

        <label>
          Password:
          <input
            type="password"
            id="signIn-password"
            placeholder="Enter your password"
            autocomplete="off"
        /></label>

        <button id="signIn-btn">Sign in</button>
      </div>
    </div>
  </body>
</html>
